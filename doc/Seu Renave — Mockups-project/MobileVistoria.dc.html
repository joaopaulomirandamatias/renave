<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Mobile — Identificação prévia — Seu Renave</title>
    <script src="./_runtime/react.js"></script>
    <script src="./_runtime/react-dom.js"></script>
    <script src="./_runtime/support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #067a45;
            text-decoration: none;
          }
          a:hover {
            color: #05663a;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          box-sizing: border-box;
          background: #f6f7f9;
          font-family: Inter, system-ui, sans-serif;
          color: #101828;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <header
          style="
            padding: 16px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e4e7ec;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px">
            <a
              href="MobileConsulta.dc.html"
              aria-label="Voltar"
              style="
                display: inline-flex;
                width: 40px;
                height: 40px;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                color: #344054;
              "
              ><svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M15 18l-6-6 6-6" /></svg
            ></a>
            <span style="display: flex; flex-direction: column"
              ><strong style="font-size: 16px; font-weight: 600"
                >Identificação prévia</strong
              ><span style="font-size: 12px; color: #475467"
                >RVA2C17 · T-Cross Highline</span
              ></span
            >
            <svg
              width="28"
              height="28"
              viewBox="0 0 32 32"
              role="img"
              aria-label="Seu Renave"
              style="flex-shrink: 0; margin-left: auto"
            >
              <path
                d="M8 3.5h10.5l6 6V26a2.5 2.5 0 0 1-2.5 2.5H8A2.5 2.5 0 0 1 5.5 26V6A2.5 2.5 0 0 1 8 3.5z"
                fill="#FFFFFF"
                stroke="#0B2550"
                stroke-width="2.6"
                stroke-linejoin="round"
              />
              <path
                d="M18.5 3.5v6h6z"
                fill="#0A9B55"
                stroke="#0A9B55"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <circle
                cx="24.5"
                cy="17"
                r="6"
                fill="#0A9B55"
                stroke="#FFFFFF"
                stroke-width="1.6"
              />
              <path
                d="M21.8 17.1l1.9 1.9 3.5-3.7"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 12px;
                color: #475467;
              "
            >
              <span>{{done}} de 8 fotos obrigatórias</span
              ><span>Hodômetro {{odoStatus}}</span>
            </div>
            <div
              style="
                height: 6px;
                border-radius: 999px;
                background: #f2f4f7;
                overflow: hidden;
              "
            >
              <div
                style="height: 6px; border-radius: 999px; background: #067A45; width: {{pct}}"
              ></div>
            </div>
          </div>
        </header>

        <div
          style="
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          "
        >
          <div
            style="
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 10px;
            "
          >
            <sc-for list="{{shots}}" as="s" hint-placeholder-count="8">
              <button
                type="button"
                onClick="{{s.take}}"
                style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 104px; border-radius: 10px; font: inherit; cursor: pointer; border: {{s.border}}; background: {{s.bg}}; color: {{s.color}}"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="{{s.icon}}" />
                </svg>
                <span style="font-size: 13px; font-weight: 600"
                  >{{s.label}}</span
                >
                <span style="font-size: 11px; font-weight: 500"
                  >{{s.state}}</span
                >
              </button>
            </sc-for>
          </div>

          <label
            style="
              display: flex;
              flex-direction: column;
              gap: 6px;
              font-size: 14px;
              font-weight: 500;
              color: #344054;
            "
            >Hodômetro (km)
            <input
              inputmode="numeric"
              value="24.870"
              style="
                height: 48px;
                box-sizing: border-box;
                padding: 0 12px;
                border: 1px solid #d0d5dd;
                border-radius: 10px;
                font: inherit;
                font-size: 18px;
                font-weight: 600;
              "
            />
          </label>
          <span style="font-size: 12px; color: #475467"
            >Confira com a foto do painel. Divergência acima de 50 km exige
            justificativa.</span
          >

          <label
            style="
              display: flex;
              flex-direction: column;
              gap: 6px;
              font-size: 14px;
              font-weight: 500;
              color: #344054;
            "
            >Observações (opcional)
            <textarea
              rows="2"
              style="
                box-sizing: border-box;
                padding: 10px 12px;
                border: 1px solid #d0d5dd;
                border-radius: 10px;
                font: inherit;
                font-size: 14px;
                resize: none;
              "
            >
Pequeno risco no para-choque traseiro.</textarea>
          </label>
        </div>

        <div
          style="
            padding: 12px 20px 24px;
            background: #ffffff;
            border-top: 1px solid #e4e7ec;
            display: flex;
            flex-direction: column;
            gap: 8px;
          "
        >
          <button
            type="button"
            style="min-height: 52px; border: 0; border-radius: 10px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; background: {{sendBg}}; color: {{sendColor}}"
          >
            {{sendLabel}}
          </button>
          <span style="font-size: 12px; color: #475467; text-align: center"
            >Fotos com data, hora e localização. Guardadas com hash de
            integridade.</span
          >
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        constructor(props) { super(props); this.state = { taken: [true, true, true, true, true, false, false, false] }; }
        renderVals() {
          const CAM = 'M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z', OK = 'M5 12l5 5L20 7';
          const labels = ['Frente', 'Traseira', 'Lateral esquerda', 'Lateral direita', 'Painel / hodômetro', 'Chassi gravado', 'Motor', 'Etiqueta do vidro'];
          const taken = this.state.taken;
          const shots = labels.map((label, i) => ({
            label, state: taken[i] ? 'Capturada · 15:41' : 'Toque para fotografar', icon: taken[i] ? OK : CAM,
            bg: taken[i] ? '#F3FBF6' : '#FFFFFF', border: taken[i] ? '1px solid #A7DDBF' : '2px dashed #D0D5DD', color: taken[i] ? '#067647' : '#344054',
            take: () => { const t = taken.slice(); t[i] = true; this.setState({ taken: t }); }
          }));
          const done = taken.filter(Boolean).length, all = done === 8;
          return {
            shots, done: String(done), pct: Math.round(done / 8 * 100) + '%', odoStatus: 'informado',
            sendLabel: all ? 'Enviar identificação prévia' : 'Faltam ' + (8 - done) + ' fotos',
            sendBg: all ? '#067A45' : '#F2F4F7', sendColor: all ? '#FFFFFF' : '#475467'
          };
        }
      }
    </script>
  </body>
</html>
