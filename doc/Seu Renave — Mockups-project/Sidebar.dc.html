<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Sidebar — Seu Renave</title>
    <script src="./_runtime/react.js"></script>
    <script src="./_runtime/react-dom.js"></script>
    <script src="./_runtime/support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@900&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <nav
        aria-label="Navegação principal"
        style="
          box-sizing: border-box;
          width: 100%;
          min-height: 900px;
          padding: 20px 12px;
          display: flex;
          flex-direction: column;
          gap: 20px;
          background: #ffffff;
          font-family: Inter, system-ui, sans-serif;
          color: #101828;
        "
      >
        <a
          href="Main.dc.html"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px;
            text-decoration: none;
            color: #101828;
          "
        >
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M8 3.5h10.5l6 6V26a2.5 2.5 0 0 1-2.5 2.5H8A2.5 2.5 0 0 1 5.5 26V6A2.5 2.5 0 0 1 8 3.5z"
              fill="#FFFFFF"
              stroke="#0B2550"
              stroke-width="2.6"
              stroke-linejoin="round"
            />
            <path
              d="M18.5 3.5v6h6z"
              fill="#0A9B55"
              stroke="#0A9B55"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <circle
              cx="24.5"
              cy="17"
              r="6"
              fill="#0A9B55"
              stroke="#FFFFFF"
              stroke-width="1.6"
            />
            <path
              d="M21.8 17.1l1.9 1.9 3.5-3.7"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span style="display: flex; flex-direction: column; line-height: 1.1">
            <span
              style="
                font-family: Nunito, Inter, sans-serif;
                font-weight: 900;
                font-size: 19px;
                letter-spacing: -0.01em;
              "
              ><span style="color: #0b2550">Seu</span>
              <span style="color: #0a9b55">Renave</span></span
            >
            <span style="font-size: 12px; color: #475467"
              >Auto Prime Veículos</span
            >
          </span>
        </a>

        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{main}}" as="item" hint-placeholder-count="10">
            <a
              href="{{item.href}}"
              aria-current="{{item.current}}"
              style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: {{item.weight}}; background: {{item.bg}}; color: {{item.color}}"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="{{item.icon}}" />
              </svg>
              <span style="flex: 1">{{item.label}}</span>
              <sc-if
                value="{{item.hasBadge}}"
                hint-placeholder-val="{{ false }}"
              >
                <span
                  style="
                    font-size: 12px;
                    font-weight: 600;
                    min-width: 22px;
                    text-align: center;
                    padding: 2px 6px;
                    border-radius: 999px;
                    background: #fef3f2;
                    color: #b42318;
                  "
                  >{{item.badge}}</span
                >
              </sc-if>
            </a>
          </sc-for>
        </div>

        <div style="display: flex; flex-direction: column; gap: 2px">
          <span
            style="
              padding: 0 10px 6px;
              font-size: 12px;
              font-weight: 600;
              letter-spacing: 0.04em;
              text-transform: uppercase;
              color: #475467;
            "
            >Configurações</span
          >
          <sc-for list="{{config}}" as="item" hint-placeholder-count="4">
            <a
              href="{{item.href}}"
              aria-current="{{item.current}}"
              style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: {{item.weight}}; background: {{item.bg}}; color: {{item.color}}"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="{{item.icon}}" />
              </svg>
              <span>{{item.label}}</span>
            </a>
          </sc-for>
        </div>

        <div
          style="
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 6px;
              padding: 12px;
              border: 1px solid #e4e7ec;
              border-radius: 10px;
            "
          >
            <span
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                font-weight: 600;
                color: #067647;
              "
            >
              <span
                style="
                  width: 8px;
                  height: 8px;
                  border-radius: 999px;
                  background: #12b76a;
                "
              ></span>
              Conector RENAVE: Operacional
            </span>
            <span style="font-size: 12px; color: #475467"
              >Última resposta há 8 s · p95 1,4 s</span
            >
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 4px 6px;
            "
          >
            <span
              style="
                display: inline-flex;
                width: 36px;
                height: 36px;
                border-radius: 999px;
                background: #e7f6ee;
                color: #067a45;
                font-size: 13px;
                font-weight: 700;
                align-items: center;
                justify-content: center;
              "
              >MC</span
            >
            <span
              style="
                display: flex;
                flex-direction: column;
                line-height: 1.25;
                min-width: 0;
              "
            >
              <strong style="font-size: 14px; font-weight: 600"
                >Marina Costa</strong
              >
              <span style="font-size: 12px; color: #475467"
                >Operadora RENAVE</span
              >
            </span>
          </div>
          <span
            style="
              padding: 10px 6px 0;
              border-top: 1px solid #e4e7ec;
              font-size: 12px;
              font-weight: 500;
              color: #475467;
            "
            >Seu Renave · Plataforma privada de integração com o RENAVE</span
          >
        </div>
      </nav>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"active":{"editor":"enum","options":["painel","estoque","entradas","saidas","zerokm","transferencias","consignacao","pendencias","documentos","auditoria","estabelecimentos","integracoes","usuarios","assinatura"],"default":"painel"},"$preview":{"width":248,"height":900}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const active = this.props.active ?? 'painel';
          const deco = (it) => {
            const on = it.id === active;
            return Object.assign({}, it, {
              bg: on ? '#E7F6EE' : 'transparent',
              color: on ? '#067A45' : '#344054',
              weight: on ? '600' : '500',
              current: on ? 'page' : 'false',
              hasBadge: !!it.badge
            });
          };
          const main = [
            { id: 'painel', label: 'Painel', href: 'Main.dc.html', icon: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z' },
            { id: 'estoque', label: 'Estoque', href: 'Estoque.dc.html', icon: 'M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10' },
            { id: 'entradas', label: 'Entradas', href: 'Entrada.dc.html', icon: 'M3 12h13M12 7l5 5-5 5M21 4v16' },
            { id: 'saidas', label: 'Saídas', href: 'Saida.dc.html', icon: 'M21 12H8M12 7l-5 5 5 5M3 4v16' },
            { id: 'zerokm', label: 'Zero km', href: 'ZeroKm.dc.html', icon: 'M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9z' },
            { id: 'transferencias', label: 'Transferências', href: 'Transferencias.dc.html', icon: 'M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4' },
            { id: 'consignacao', label: 'Consignação', href: 'Consignacao.dc.html', icon: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4' },
            { id: 'pendencias', label: 'Pendências', href: 'Pendencias.dc.html', icon: 'M12 8v5M12 16h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', badge: '14' },
            { id: 'documentos', label: 'Documentos', href: 'Documentos.dc.html', icon: 'M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z' },
            { id: 'auditoria', label: 'Auditoria', href: 'Auditoria.dc.html', icon: 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6zM9 12l2 2 4-4' }
          ].map(deco);
          const config = [
            { id: 'estabelecimentos', label: 'Estabelecimentos & Certificados', href: 'Estabelecimentos.dc.html', icon: 'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6' },
            { id: 'integracoes', label: 'Integrações (API / Webhooks)', href: 'Integracoes.dc.html', icon: 'M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16' },
            { id: 'usuarios', label: 'Usuários & Perfis', href: 'Usuarios.dc.html', icon: 'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8' },
            { id: 'assinatura', label: 'Consumo e faturas', href: 'MinhaAssinatura.dc.html', icon: 'M3 6h18v12H3zM3 10h18M7 15h3' }
          ].map(deco);
          return { main, config };
        }
      }
    </script>
  </body>
</html>
