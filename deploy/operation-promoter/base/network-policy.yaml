apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renave-operation-promoter-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: operation-promoter
      app.kubernetes.io/name: seu-renave
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renave-operation-promoter-dns
  annotations:
    seu-renave.io/verify-before-use: cluster-dns-selector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: operation-promoter
      app.kubernetes.io/name: seu-renave
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renave-operation-promoter-postgres-placeholder
  annotations:
    seu-renave.io/replace-before-use: database-cidr-and-port
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: operation-promoter
      app.kubernetes.io/name: seu-renave
  policyTypes:
    - Egress
  egress:
    - to:
        # TEST-NET-1 e inoperante. Substitua somente pelo CIDR exato do banco.
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 5432
          protocol: TCP

# Nao ha egress para SERPRO, Internet, metadata service ou API Kubernetes.
# A unica saida de negocio admitida por este template e o PostgreSQL exato.
